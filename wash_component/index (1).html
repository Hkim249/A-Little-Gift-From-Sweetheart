ter">LÀM SẠCH: 0/5 VẾT BẨN</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status"></div></div><div class="fade" id="fade"></div>
<script>
const stage=document.getElementById('stage'),face=document.getElementById('face'),bottle=document.getElementById('bottle'),shower=document.getElementById('shower'),spots=[...document.querySelectorAll('.spot')],foam=document.getElementById('foam'),water=document.getElementById('water'),instruction=document.getElementById('instruction'),meter=document.getElementById('meter'),fill=document.getElementById('fill'),status=document.getElementById('status'),fade=document.getElementById('fade');let mode='soap',drag=false,showerDrag=false,done=0,washed=false,rinseStarted=0;
function setProgress(){meter.textContent=mode==='soap'?`LÀM SẠCH: ${done}/5 VẾT BẨN`:`RỬA BỌT: ${washed?1:0}/1`;fill.style.width=(mode==='soap'?done/5:washed?1:0)*100+'%'}
bottle.addEventListener('pointerdown',e=>{if(mode!=='soap')return;drag=true;bottle.setPointerCapture(e.pointerId);e.preventDefault()});bottle.addEventListener('pointermove',e=>{if(!drag||mode!=='soap')return;const s=stage.getBoundingClientRect();bottle.style.left=(e.clientX-s.left-28)+'px';bottle.style.top=(e.clientY-s.top-28)+'px';bottle.style.bottom='auto';const br=bottle.getBoundingClientRect();spots.forEach(sp=>{if(sp.classList.contains('clean'))return;const r=sp.getBoundingClientRect();if(br.right>r.left-8&&br.left<r.right+8&&br.bottom>r.top-8&&br.top<r.bottom+8){sp.classList.add('clean');done++;foam.classList.add('show');setProgress();if(done===spots.length){mode='rinse';drag=false;instruction.textContent='Giữ vòi sen để xịt nước, rửa sạch lớp bọt trên mặt nhé!';bottle.style.opacity='.35';bottle.style.pointerEvents='none';status.textContent='BỌT ĐÃ PHỦ ĐỀU — ĐẾN LƯỢT XẢ NƯỚC!';setProgress()}}})});bottle.addEventListener('pointerup',()=>drag=false);bottle.addEventListener('pointercancel',()=>drag=false);
function startWater(e){if(mode!=='rinse')return;showerDrag=true;shower.setPointerCapture(e.pointerId);rinseStarted=Date.now();water.classList.add('on');foam.classList.add('rinse');status.textContent='ĐANG XẢ NƯỚC — DI CHUYỂN VÒI SEN QUA KHUÔN MẶT!';clearTimeout(window.rinseTimer);window.rinseTimer=setTimeout(()=>{if(mode!=='rinse'||!showerDrag)return;washed=true;mode='done';water.classList.remove('on');foam.style.opacity='0';face.style.filter='brightness(1.2) saturate(1.12)';face.style.dropShadow='0 0 18px #fff8c9';face.style.transform='scale(1.025)';status.textContent='SẠCH BONG, SÁNG BÓNG RỒI!';instruction.textContent='Hoàn thành rửa mặt! Đang quay lại phòng tắm…';setProgress();setTimeout(()=>{fade.classList.add('on');setTimeout(()=>window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:'done',dataType:'json'},'*'),750)},1000)},1900);e.preventDefault()}
shower.addEventListener('pointerdown',startWater);shower.addEventListener('pointermove',e=>{if(!showerDrag||mode!=='rinse')return;const r=stage.getBoundingClientRect();const x=Math.max(0,Math.min(r.width-shower.offsetWidth,e.clientX-r.left-shower.offsetWidth/2));const y=Math.max(0,Math.min(r.height-shower.offsetHeight,e.clientY-r.top-shower.offsetHeight/2));shower.style.left=x+'px';shower.style.top=y+'px';shower.style.right='auto';shower.style.bottom='auto';const sr=shower.getBoundingClientRect(),fr=face.getBoundingClientRect();water.style.left=(x+shower.offsetWidth/2-12)+'px';water.style.top=(y+shower.offsetHeight/2)+'px';water.style.right='auto';water.style.width='90px';water.style.height='150px';water.style.transform='rotate(15deg)';});
function stopWater(){if(!showerDrag)return;showerDrag=false;if(mode==='rinse'&&!washed){water.classList.remove('on');foam.classList.remove('rinse');status.textContent='Giữ và di chuyển vòi sen liên tục để xả sạch bọt nhé!';clearTimeout(window.rinseTimer)}}shower.addEventListener('pointerup',stopWater);shower.addEventListener('pointercancel',stopWater);
function fit(){const h=Math.max(250,Math.min(760,window.innerHeight||560));window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');fit();window.addEventListener('resize',fit);
</script></body></html>
