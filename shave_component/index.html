<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#654858}.wrap{width:min(100%,900px);height:calc(100vh - 12px);min-height:0;margin:0 auto;padding:clamp(8px,2vh,18px);background:#fff3e9;border:4px solid #76536a;box-shadow:5px 5px #241d35;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1vh,10px);overflow:hidden}.hint{font-weight:700;line-height:1.35;margin:0;font-size:clamp(12px,1.8vh,16px);flex:0 0 auto}.face{position:relative;width:min(520px,82vw);height:clamp(190px,calc(100vh - 245px),350px);max-height:58vh;min-height:0;flex:0 1 auto;margin:0 auto;border:4px solid #8a5e68;border-radius:48% 48% 42% 42%;background:linear-gradient(145deg,#f6c6a9,#e9a98f);box-shadow:inset -12px -10px #d99283,5px 6px #c58a91;overflow:hidden;touch-action:none}.nose{position:absolute;left:48%;top:40%;width:22px;height:28px;border-right:4px solid #a76c68;border-bottom:4px solid #a76c68;transform:rotate(25deg);border-radius:0 0 12px 0}.mouth{position:absolute;left:39%;top:55%;width:23%;height:24px;border-bottom:7px solid #783e4a;border-radius:0 0 50% 50%}.hair{position:absolute;width:8px;height:39px;background:#3c3035;border-radius:5px;box-shadow:1px 1px #241d35;transform-origin:bottom;transition:transform .48s ease,opacity .48s ease}.hair.gone{transform:translate(30px,100px) rotate(90deg);opacity:0}.h0{left:27%;top:68%;transform:rotate(-25deg)}.h1{left:34%;top:74%;transform:rotate(12deg)}.h2{left:42%;top:69%;transform:rotate(-12deg)}.h3{left:49%;top:76%;transform:rotate(18deg)}.h4{left:57%;top:69%;transform:rotate(-18deg)}.h5{left:65%;top:74%;transform:rotate(20deg)}.h6{left:72%;top:67%;transform:rotate(30deg)}.razor{position:absolute;z-index:5;left:8%;top:12%;width:78px;height:92px;display:grid;place-items:center;font-size:58px;cursor:grab;user-select:none;touch-action:none;filter:drop-shadow(3px 4px 1px #76536a)}.razor:active{cursor:grabbing}.progress{font-weight:800;margin-top:0;font-size:clamp(12px,1.8vh,16px);flex:0 0 auto}.done{display:none;color:#47754d;font-weight:800;font-size:clamp(13px,2vh,18px);margin:0;flex:0 0 auto}.done.show{display:block}.sub{font-size:clamp(10px,1.4vh,12px);opacity:.8;margin:0;flex:0 0 auto}@media(max-width:600px){.face{width:min(520px,88vw);height:clamp(190px,calc(100vh - 230px),350px);max-height:56vh}.wrap{padding:8px}.razor{font-size:48px}}@media(max-height:560px){.wrap{gap:3px;padding:5px}.face{height:calc(100vh - 185px);max-height:52vh}.hint{font-size:11px}.progress{font-size:11px}.sub{font-size:9px}}
</style></head><body><div class="wrap"><p class="hint">Giữ chuột vào dao cạo, kéo lưỡi dao qua từng cọng râu để cạo nhé!</p><div class="face" id="face"><div class="nose"></div><div class="mouth"></div><span class="hair h0"></span><span class="hair h1"></span><span class="hair h2"></span><span class="hair h3"></span><span class="hair h4"></span><span class="hair h5"></span><span class="hair h6"></span><div class="razor" id="razor" aria-label="Dao cạo">🪒</div></div><div class="progress" id="progress">ĐÃ CẠO: 0/7 CỌNG RÂU</div><div class="done" id="done">ĐÃ CẠO SẠCH! ĐANG QUAY LẠI PHÒNG TẮM…</div><div class="sub">Kéo dao cạo trực tiếp trên khuôn mặt</div></div>
<script>
const razor=document.getElementById('razor'),face=document.getElementById('face'),hairs=[...document.querySelectorAll('.hair')],progress=document.getElementById('progress'),done=document.getElementById('done');let dragging=false,finished=false,offset={x:0,y:0};
function point(e){const r=face.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
razor.addEventListener('pointerdown',e=>{if(finished)return;dragging=true;razor.setPointerCapture(e.pointerId);const p=point(e),r=razor.getBoundingClientRect(),f=face.getBoundingClientRect();offset={x:e.clientX-r.left,y:e.clientY-r.top};e.preventDefault()});
razor.addEventListener('pointermove',e=>{if(!dragging||finished)return;const p=point(e);razor.style.left=(p.x-offset.x)+'px';razor.style.top=(p.y-offset.y)+'px';const blade={left:p.x-23,right:p.x+28,top:p.y-20,bottom:p.y+24};hairs.forEach(h=>{if(h.classList.contains('gone'))return;const r=h.getBoundingClientRect(),f=face.getBoundingClientRect(),b={left:r.left-f.left,right:r.right-f.left,top:r.top-f.top,bottom:r.bottom-f.top};if(blade.right>b.left&&blade.left<b.right&&blade.bottom>b.top&&blade.top<b.bottom){h.classList.add('gone');const n=hairs.filter(x=>x.classList.contains('gone')).length;progress.textContent=`ĐÃ CẠO: ${n}/7 CỌNG RÂU`;if(n===7&&!finished){finished=true;done.classList.add('show');setTimeout(()=>{window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:'done',dataType:'json'},'*')},1000)}}})});
razor.addEventListener('pointerup',()=>dragging=false);razor.addEventListener('pointercancel',()=>dragging=false);
function fitFrame(){const h=Math.max(260,Math.min(760,window.innerHeight||560));window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');fitFrame();window.addEventListener('resize',fitFrame);
</script></body></html>
