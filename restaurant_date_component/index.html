<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>A Little Date</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="date-stage" aria-label="Hai nhân vật bước vào nhà hàng">
    <div class="restaurant-bg"></div>
    <div class="warm-overlay"></div>
    <div class="ambient-lights"></div>
    <div class="couple-shadow"></div>
    <img class="couple-walk" src="assets/couple_walk.png" alt="Đăng Khoa và Hoàng Kim nắm tay nhau bước vào nhà hàng">
    <div class="date-message" id="dateMessage">
      <span class="eyebrow">♡ A LITTLE DATE ♡</span>
      <strong>Một buổi tối dành riêng cho hai chúng mình</strong>
      <span>Chúc hai bạn có một buổi hẹn thật đáng nhớ!</span>
    </div>
  </main>
  <script src="date.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1}, '*');
      window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.max(document.documentElement.scrollHeight,700)}, '*');
    });
    window.addEventListener('resize', () => {
      window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.max(document.documentElement.scrollHeight,700)}, '*');
    });
  </script>
</body>
</html>
